spring.application.name=backend

# Database Configuration (Environment variables with development defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/livraisonProject?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Yasserder78@}

# JPA / Hibernate - Validates schema against entity definitions
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway Migration Engine
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Secret & Expiration
jwt.secret=${JWT_SECRET:change-this-to-a-real-256-bit-secret-in-prod-at-least-32-chars!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
